name: production manifest

# main and dev do not publish. This file runs only for the production branch.
on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the production manifest
        shell: pwsh
        run: |
          $missing = @()
          foreach ($path in @("build\Release\DoomNet.exe", "build\Release\version.dll", "payload\player\plugin.json", "payload\skin\skin.json")) {
            if (-not (Test-Path -LiteralPath $path)) { $missing += $path }
          }
          if ($missing.Count -gt 0) {
            Write-Output ("Production publish refused because these files are not in the tree: " + ($missing -join ", "))
            exit 1
          }
          .\tools\Write-ProductionManifest.ps1 -DoomNetExe build\Release\DoomNet.exe -PluginJson payload\player\plugin.json -SkinJson payload\skin\skin.json -OutFile production-manifest.json
      - name: Publish the manifest and payloads on the production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload production production-manifest.json doomnet.zip steamtunes.zip steamskin.zip --clobber
