name: production manifest

# The tester zip is published by tools/Publish-Remote.ps1 before a push of
# main or production. This workflow cannot see the private player and skin
# repos, so it does not upload a zip and it does not run on push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: windows-latest
    steps:
      - name: The zip is published by the push hook
        shell: pwsh
        run: Write-Output "The tester zip is replaced by tools/Publish-Remote.ps1 when main or production is pushed."
